# 登录接口限流：每个 IP 平均每分钟 5 次，允许小幅 burst
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# 验证码接口限流：每个 IP 平均每分钟 30 次，允许小幅 burst
limit_req_zone $binary_remote_addr zone=captcha_zone:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    # 验证码接口限流
    location = /api/auth/captcha {
        limit_req zone=captcha_zone burst=10 nodelay;
        proxy_pass http://backend:8000/api/auth/captcha;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 暴露 X-Captcha-Id 响应头给前端
        add_header Access-Control-Expose-Headers "X-Captcha-Id" always;
    }

    # 登录接口限流
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
