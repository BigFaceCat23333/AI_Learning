services:
  backend:
    build:
      context: ./backend
    environment:
      AI_LEARNING_DATABASE_URL: ${AI_LEARNING_DATABASE_URL:-postgresql+psycopg://urpapa:postgres@host.docker.internal:5432/ai_learning}
      AI_LEARNING_LLM_BASE_URL: ${AI_LEARNING_LLM_BASE_URL:-https://api.deepseek.com}
      AI_LEARNING_LLM_API_KEY: ${AI_LEARNING_LLM_API_KEY:-}
      AI_LEARNING_LLM_MODEL: ${AI_LEARNING_LLM_MODEL:-deepseek-v4-flash}
      AI_LEARNING_EMBEDDING_PROVIDER: ${AI_LEARNING_EMBEDDING_PROVIDER:-openai_compatible}
      AI_LEARNING_EMBEDDING_BASE_URL: ${AI_LEARNING_EMBEDDING_BASE_URL:-}
      AI_LEARNING_EMBEDDING_API_KEY: ${AI_LEARNING_EMBEDDING_API_KEY:-}
      AI_LEARNING_EMBEDDING_MODEL: ${AI_LEARNING_EMBEDDING_MODEL:-text-embedding-v4}
      AI_LEARNING_EMBEDDING_DIMENSIONS: ${AI_LEARNING_EMBEDDING_DIMENSIONS:-1536}
      AI_LEARNING_RETRIEVAL_MIN_SCORE: ${AI_LEARNING_RETRIEVAL_MIN_SCORE:-0.35}
      AI_LEARNING_RETRIEVAL_TOP_K: ${AI_LEARNING_RETRIEVAL_TOP_K:-5}
      AI_LEARNING_RETRIEVAL_CANDIDATE_K: ${AI_LEARNING_RETRIEVAL_CANDIDATE_K:-20}
      AI_LEARNING_UPLOAD_DIR: /app/uploads
      AI_LEARNING_UPLOAD_MAX_BYTES: ${AI_LEARNING_UPLOAD_MAX_BYTES:-5242880}
      AI_LEARNING_SQL_ECHO: ${AI_LEARNING_SQL_ECHO:-false}
      AI_LEARNING_RAG_DEBUG_LOGS: ${AI_LEARNING_RAG_DEBUG_LOGS:-false}
      PYTHONPATH: /app/backend/src
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"

  front:
    build:
      context: ./front
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend_uploads:
