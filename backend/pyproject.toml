[project]
name = "ai-learning"
version = "0.1.0"
description = "FastAPI project for AI learning, RAG, and simple agent workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pgvector>=0.4.0",
    "pwdlib[argon2]>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai-learning = "ai_learning.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_learning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
